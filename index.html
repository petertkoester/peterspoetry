<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peter's Poetry</title>
    <meta name="description" content="Poetry by Peter Koester">

    <style>
        :root {
            --paper: #f8f6f0;
            --ink: #24231f;
            --muted: #77736a;
            --rule: #d9d5ca;
            --accent: #8b3030;
            --accent-dark: #682323;
            --max-width: 900px;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.7;
        }

        .container {
            width: min(90%, var(--max-width));
            margin: 0 auto;
        }

        header {
            padding: 85px 0 60px;
            text-align: center;
        }

        .site-title {
            margin: 0;
            font-size: clamp(2.8rem, 7vw, 5rem);
            font-weight: normal;
            letter-spacing: 0.04em;
            line-height: 1.05;
        }

        .subtitle {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 1rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .section-heading {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 0 0 30px;
            color: var(--accent-dark);
            font-size: 0.85rem;
            font-weight: normal;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .section-heading::after {
            content: "";
            height: 1px;
            flex: 1;
            background: var(--rule);
        }

        .poems {
            margin-bottom: 100px;
        }

        .poem {
            padding: 28px 0;
            border-bottom: 1px solid var(--rule);
        }

        .poem:first-child {
            border-top: 1px solid var(--rule);
        }

        .poem-title {
            margin: 0;
            font-size: 1.55rem;
            font-weight: normal;
            line-height: 1.3;
        }

        .poem-title a {
            color: var(--ink);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .poem-title a:hover {
            color: var(--accent);
        }

        .poem-date {
            margin-top: 7px;
            color: var(--muted);
            font-size: 0.85rem;
            letter-spacing: 0.06em;
        }

        .poem-excerpt {
            max-width: 650px;
            margin: 12px 0 0;
            color: #59564f;
            font-size: 1rem;
        }

        footer {
            padding: 25px 0 45px;
            color: var(--muted);
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
        }

        @media (max-width: 600px) {
            header { padding: 55px 0 45px; }

            .subtitle {
                font-size: 0.75rem;
                letter-spacing: 0.14em;
            }

            .poem { padding: 24px 0; }

            .poem-title { font-size: 1.35rem; }

            .poem-excerpt { font-size: 0.95rem; }
        }
    </style>
</head>

<body>

    <header class="container">
        <h1 class="site-title">Peter's Poetry</h1>
        <p class="subtitle">Poems by Peter Koester</p>
    </header>

    <main class="container">
        <section class="poems">

            <h2 class="section-heading">Poems</h2>

            <!-- =================================================
                 ADD NEW POEMS HERE
                 Copy a poem block and change the title, date,
                 link, and excerpt.
                 ================================================= -->

            <article class="poem">
                <h3 class="poem-title">
                    <a href="poems/the-golden-light.html">The Golden Light</a>
                </h3>
                <div class="poem-date">September 2026</div>
                <p class="poem-excerpt">
                    A poem about light, love, memory, and the passage of time.
                </p>
            </article>

            <article class="poem">
                <h3 class="poem-title">
                    <a href="poems/after-the-rain.html">After the Rain</a>
                </h3>
                <div class="poem-date">August 2026</div>
                <p class="poem-excerpt">
                    Your poem's opening lines or a short description can go here.
                </p>
            </article>

            <!-- =================================================
                 COPY THIS BLOCK FOR EACH NEW POEM

            <article class="poem">
                <h3 class="poem-title">
                    <a href="poems/your-poem-file.html">Your Poem Title</a>
                </h3>
                <div class="poem-date">September 2026</div>
                <p class="poem-excerpt">
                    A short description or opening line.
                </p>
            </article>

            ================================================= -->

        </section>
    </main>

    <footer>
        Peter Koester
    </footer>

</body>
</html>
