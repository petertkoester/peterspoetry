            Tanka: Inner Light (Shinko)

    <div class="poem-date">
        September 2026
    </div>

    <p class="poem-excerpt">
        A cathedral of

        Bamboo rustling lace, ore clefts,

        Echo dim thunder

        Encroaching, this world shrouded, save

        Your inward star shining forth


          -at Kyoto, 1/13/2024
    </p>
